name: Coletor meteorológico online

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stormtrack-weather-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar leitores científicos
        run: python -m pip install -r requirements.txt
      - name: Coletar e publicar dados processados
        env:
          STORMTRACK_CLOUD_DATABASE_URL: ${{ secrets.STORMTRACK_CLOUD_DATABASE_URL }}
        run: python -m backend.app.scripts.cloud_collector
